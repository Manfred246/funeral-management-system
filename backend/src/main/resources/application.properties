spring.application.name=funeral-management-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/funeral_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Apply database/schema.sql explicitly before starting the backend.
spring.sql.init.mode=never

server.port=8080
