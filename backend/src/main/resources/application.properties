spring.application.name=funeral-management-backend
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/funeral_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# HTTP healthcheck не раскрывает БД, exception messages или другие components.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

app.jwt.secret=${JWT_SECRET:}
app.admin.login=${APP_ADMIN_LOGIN:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:}
# Вход выполняется AuthService; стандартный пользователь Boot не нужен.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
