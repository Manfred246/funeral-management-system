spring.application.name=funeral-management-backend
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/funeral_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

app.jwt.secret=${JWT_SECRET:}
app.admin.login=${APP_ADMIN_LOGIN:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:}
# Вход выполняется AuthService; стандартный пользователь Boot не нужен.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
