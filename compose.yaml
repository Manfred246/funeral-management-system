services:

  postgres:
    image: postgres:17
    container_name: funeral-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-funeral_management}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}

    volumes:
      - funeral-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: funeral-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-funeral_management}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting backend}
      APP_ADMIN_LOGIN: ${APP_ADMIN_LOGIN:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  funeral-postgres-data:
