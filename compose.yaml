services:

  postgres:
    image: postgres:17
    container_name: funeral-postgres

    environment:
      POSTGRES_DB: funeral_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - funeral-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d funeral_management"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: funeral-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/funeral_management
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  funeral-postgres-data: